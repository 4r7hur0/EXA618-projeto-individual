# Blueprint Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: catalogo-aparelhos
    runtime: python
    buildCommand: >-
      pip install -r requirements-prod.txt &&
      cd frontend && npm ci && npm run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENABLE_CRAWLERS
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Defina no painel do Render (não commite senhas):
      # DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD, DB_SSL=true
      # ou DATABASE_URL
