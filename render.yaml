# Blueprint Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: catalogo-aparelhos
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ENABLE_CRAWLERS
        value: "0"
      # Defina no painel (Supabase): DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD, DB_SSL=true
      # ou DATABASE_URL (External / Supabase pooler). Não use host dpg-xxx-a sem domínio.
